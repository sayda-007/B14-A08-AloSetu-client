<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AloSetu icon</title>
  <desc id="desc">A warm terracotta community bridge icon with a cream arch and golden connection dots.</desc>
  <defs>
    <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D05A4D"/>
      <stop offset="1" stop-color="#B9433D"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E8"/>
      <stop offset="1" stop-color="#F8F4EC"/>
    </linearGradient>
  </defs>

  <!-- Rounded terracotta tile -->
  <rect x="10" y="10" width="492" height="492" rx="112" fill="url(#terracotta)"/>

  <!-- Golden points of connection -->
  <g fill="#F5D887">
    <circle cx="96" cy="174" r="29"/>
    <circle cx="164" cy="119" r="30"/>
    <circle cx="256" cy="94" r="32"/>
    <circle cx="348" cy="119" r="30"/>
    <circle cx="416" cy="174" r="29"/>
  </g>

  <!-- Bridge structure -->
  <path d="M52 262H118C151 193 199 154 256 154C313 154 361 193 394 262H460V416C393 392 333 397 256 397C179 397 119 392 52 416V262Z" fill="url(#cream)"/>

  <!-- Open arch beneath the bridge -->
  <path d="M164 398V321C164 270 205 229 256 229C307 229 348 270 348 321V398C317 397 286 397 256 397C226 397 195 397 164 398Z" fill="#C44B56"/>

  <!-- Curved bridge deck -->
  <path d="M38 406C111 372 179 378 256 385C333 392 401 372 474 406C402 434 331 444 256 433C181 422 110 397 38 435V406Z" fill="url(#cream)"/>
</svg>
